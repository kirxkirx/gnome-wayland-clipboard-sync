name: test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.ext }} on ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {image: "rockylinux:9", ext: gnome-40}   # GNOME 40
          - {image: "almalinux:9", ext: gnome-40}    # GNOME 40
          - {image: "fedora:43", ext: gnome-45}      # GNOME 49
          - {image: "fedora:44", ext: gnome-45}      # GNOME 50
          - {image: "fedora:45", ext: gnome-45}      # GNOME 51
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Install dependencies
        run: |
          if [ "${{ matrix.ext }}" = gnome-40 ]; then
              dnf install -y epel-release
              EXTRA=/usr/bin/Xvfb
          else
              EXTRA="/usr/bin/Xwayland gdb"
          fi
          dnf install -y git gnome-shell mesa-dri-drivers dconf procps-ng \
              /usr/bin/xclip /usr/bin/dbus-run-session /usr/bin/gsettings \
              /usr/bin/glib-compile-schemas $EXTRA
          if [ "${{ matrix.ext }}" = gnome-45 ]; then
              # Debug symbols for readable backtraces if gnome-shell crashes
              dnf debuginfo-install -y mutter gnome-shell gjs ||
                  echo "WARNING: debug symbols not installed"
          fi
      - name: Prepare system services
        # GNOME Shell connects to the system bus unconditionally (e.g. for
        # UPower in the panel) and dies at startup if there is none, so
        # start a system bus. logind is still not running, but
        # systemd-tmpfiles (run by the package scriptlets) creates
        # /run/systemd/seats, which makes the Shell assume it is; remove
        # it so the Shell falls back to its dummy login manager.
        run: |
          rm -rf /run/systemd/seats
          mkdir -p /run/dbus
          dbus-daemon --system --fork
      - uses: actions/checkout@v5
      - name: Run extension test
        run: tests/run-test.sh ${{ matrix.ext }}

  shexli:
    name: Shexli static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Shexli
        run: pip install -U shexli
      - name: Build ZIPs
        run: tools/pack.sh
      - name: Run Shexli
        run: tests/run-shexli.sh dist/*.zip
