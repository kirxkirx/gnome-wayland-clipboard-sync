name: test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["rockylinux:9", "almalinux:9"]
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Install dependencies
        run: |
          dnf install -y epel-release
          dnf install -y git gnome-shell mesa-dri-drivers dconf procps-ng \
              /usr/bin/Xvfb /usr/bin/xclip /usr/bin/dbus-run-session /usr/bin/gsettings
      - name: Remove stale logind marker
        # systemd-tmpfiles (run by the package scriptlets) creates
        # /run/systemd/seats, which makes GNOME Shell assume logind is
        # running and connect to the system bus. There is no system bus
        # in the container, so the Shell dies at startup. Without this
        # directory it falls back to its dummy login manager.
        run: rm -rf /run/systemd/seats
      - uses: actions/checkout@v4
      - name: Run extension test
        run: tests/run-test.sh
