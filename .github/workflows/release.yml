name: release

# Attach the extensions.gnome.org upload ZIPs to each published release
on:
  release:
    types: [published]

jobs:
  zips:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Shexli
        run: pip install -U shexli
      - name: Build ZIPs
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: tools/pack.sh "$TAG"
      - name: Run Shexli
        run: tests/run-shexli.sh dist/*.zip
      - name: Attach ZIPs to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/*.zip --clobber
