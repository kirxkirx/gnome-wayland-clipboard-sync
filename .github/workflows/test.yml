name: test

on:
  push:
  pull_request:
  workflow_dispatch:
  # Weekly, to notice distribution updates that break the extension
  schedule:
    - cron: "23 5 * * 1"

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.ext }} on ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {image: "rockylinux/rockylinux:9", ext: gnome-40}   # GNOME 40
          - {image: "almalinux:9", ext: gnome-40}    # GNOME 40
          - {image: "ubuntu:22.04", ext: gnome-40}   # GNOME 42, gjs 1.72.4
          - {image: "debian:12", ext: gnome-40}      # GNOME 43
          - {image: "fedora:43", ext: gnome-45}      # GNOME 49
          - {image: "fedora:44", ext: gnome-45}      # GNOME 50
          - {image: "fedora:45", ext: gnome-45}      # GNOME 51
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Install dependencies
        run: |
          if command -v apt-get >/dev/null; then
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              # gnome-extensions talks to a D-Bus service that runs
              # /usr/bin/gjs, which Ubuntu's gnome-shell does not pull in.
              # curl fetches the release and extensions.gnome.org ZIPs,
              # unzip is what GNOME Shell extracts downloaded extensions with.
              apt-get install -y git gnome-shell gjs xvfb xclip dbus \
                  dconf-gsettings-backend libglib2.0-bin libgl1-mesa-dri procps \
                  curl ca-certificates unzip
              exit
          fi
          if [ "${{ matrix.ext }}" = gnome-40 ]; then
              dnf install -y epel-release
              EXTRA=/usr/bin/Xvfb
          else
              EXTRA="/usr/bin/Xwayland gdb"
          fi
          # curl fetches the release and extensions.gnome.org ZIPs, unzip is
          # what GNOME Shell extracts downloaded extensions with
          dnf install -y git gnome-shell mesa-dri-drivers dconf procps-ng \
              /usr/bin/xclip /usr/bin/dbus-run-session /usr/bin/gsettings \
              /usr/bin/glib-compile-schemas /usr/bin/curl /usr/bin/unzip $EXTRA
          if [ "${{ matrix.ext }}" = gnome-45 ]; then
              # Debug symbols for readable backtraces if gnome-shell crashes
              dnf debuginfo-install -y mutter gnome-shell gjs ||
                  echo "WARNING: debug symbols not installed"
          fi
      - name: Prepare system services
        # GNOME Shell connects to the system bus unconditionally (e.g. for
        # UPower in the panel) and dies at startup if there is none, so
        # start a system bus. logind is still not running, but
        # systemd-tmpfiles (run by the package scriptlets) creates
        # /run/systemd/seats, which makes the Shell assume it is; remove
        # it so the Shell falls back to its dummy login manager.
        run: |
          rm -rf /run/systemd/seats
          mkdir -p /run/dbus
          dbus-daemon --system --fork
      - uses: actions/checkout@v5
      # One run per installation method in README.md. The first one tests
      # this checkout; the others test the copies published on GitHub
      # releases and extensions.gnome.org, which may be older, and the
      # README commands that fetch them.
      - name: Test the checkout, copied into place
        run: tests/run-test.sh ${{ matrix.ext }} local
      - name: Test the latest GitHub release ZIP
        if: ${{ !cancelled() }}
        run: tests/run-test.sh ${{ matrix.ext }} release
      - name: Test the README curl one-liner (extensions.gnome.org)
        if: ${{ !cancelled() }}
        run: tests/run-test.sh ${{ matrix.ext }} ego-curl
      - name: Test the README gdbus call (extensions.gnome.org)
        if: ${{ !cancelled() }}
        run: tests/run-test.sh ${{ matrix.ext }} ego-dbus

  shexli:
    name: Shexli static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Shexli
        run: pip install -U shexli
      - name: Build ZIPs
        run: tools/pack.sh
      - name: Run Shexli
        run: tests/run-shexli.sh dist/*.zip
